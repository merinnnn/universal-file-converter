services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    tmpfs:
      - /tmp/fileconverter_jobs:size=1g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web