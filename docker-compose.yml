services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    tmpfs:
      # Job files live in RAM only, never touch disk, and vanish on container restart 
      # as an extra guarantee on top of the app's own TTL-based cleanup.
      - /tmp/fileconverter_jobs:size=1g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # LibreOffice is memory-hungry
          memory: 3g

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web